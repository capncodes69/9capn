# fly.capnrouter.toml — 9Router deployment on Fly.io (account: fadlisadam543@gmail.com)
# Deploy with: fly deploy --config fly.capnrouter.toml
# See https://fly.io/docs/reference/configuration/ for reference.
#
# Same shape as fly.9capn.toml (same image, same region, same volume layout), on
# the account that can actually build. The `capnrouter_data` volume carries the
# copied data dir — restoring it before the first boot is what keeps the
# dashboard sessions (jwt-secret), the CLI secret and every provider connection
# intact instead of starting from an empty DB.

app = 'capn-router'
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = 'production'
  PORT = '20128'
  HOSTNAME = '0.0.0.0'
  NEXT_TELEMETRY_DISABLED = '1'
  DATA_DIR = '/app/data'

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '8192mb'
  cpu_kind = 'performance'
  cpus = 4

[mounts]
  source = 'capnrouter_data'
  destination = '/app/data'
